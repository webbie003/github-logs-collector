services:
  github-logs-collector:
    image: ghcr.io/webbie003/github-logs-collector:${COLLECTOR_VERSION:-0.2.3}

    container_name: github-logs-collector

    restart: unless-stopped

    # Security / reliability:
    # Uses a minimal init process to correctly forward signals
    # and reap child processes.
    init: true

    # Security:
    # Environment values and credentials are kept outside the Compose file.
    env_file:
      - .env

    # Configuration:
    # Defaults can be overridden through .env or shell environment variables.
    environment:
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-20}
      MAX_PAGES: ${MAX_PAGES:-10}

      ACTIONS_MAX_RUNS_PER_REPOSITORY: ${ACTIONS_MAX_RUNS_PER_REPOSITORY:-20}

      GITHUB_ACCOUNT_EVENTS_ENABLED: ${GITHUB_ACCOUNT_EVENTS_ENABLED:-true}
      GITHUB_SECURITY_ALERTS_ENABLED: ${GITHUB_SECURITY_ALERTS_ENABLED:-true}

      GITHUB_ACTIONS_ENABLED: ${GITHUB_ACTIONS_ENABLED:-true}
      GITHUB_ACTION_FAILURE_DETAILS_ENABLED: ${GITHUB_ACTION_FAILURE_DETAILS_ENABLED:-true}

      GITHUB_REPOSITORY_SECURITY_STATE_ENABLED: ${GITHUB_REPOSITORY_SECURITY_STATE_ENABLED:-true}

      GITHUB_LOG_FILE: ${GITHUB_LOG_FILE:-/var/log/github/events.jsonl}

      COLLECTOR_LOG_FILE: ${COLLECTOR_LOG_FILE:-/var/log/github/collector.jsonl}
      COLLECTOR_OPERATIONAL_LOG_ENABLED: ${COLLECTOR_OPERATIONAL_LOG_ENABLED:-true}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_MAX_AGE: ${HEALTH_MAX_AGE:-900}

    # Security:
    # No ports are published, The collector operates outbound-only and
    # initiates HTTPS connections to the GitHub API. It does not require
    # inbound Internet connectivity.
    # ports:
    #   None required.

    # Security:
    # Persistent log output and collector state are isolated into
    # dedicated writable volumes.
    volumes:
      - github_logs:/var/log/github
      - github_state:/var/lib/github-logs-collector

    # Configuration:
    # Docker Compose creates a default network automatically.
    #
    # The collector only requires outbound HTTPS connectivity to
    # api.github.com and normally does NOT need to join the SIEM network.
    #
    # If direct container-to-container communication with an existing
    # SIEM solution is required for a future integration, uncomment this
    # section and replace <SIEM_NETWORK> with the existing Docker network.
    #
    # networks:
    #   - <SIEM_NETWORK>

    # Security:
    # Prevent processes inside the container from gaining additional
    # Linux privileges.
    security_opt:
      - no-new-privileges:true

    # Security:
    # The collector requires no Linux capabilities.
    cap_drop:
      - ALL

    # Security:
    # Make the container root filesystem immutable.
    #
    # Only the explicitly mounted log/state volumes and /tmp are writable.
    read_only: true

    # Security:
    # Provide a small memory-backed temporary filesystem.
    tmpfs:
      - /tmp:size=16M,mode=1777

    # Security:
    # Prevent excessive process creation.
    pids_limit: 50

    # Security / availability:
    # Bound memory and CPU usage if the service is abused or faults.
    mem_limit: 128m
    cpus: 0.25

    # Reliability:
    # Health is based on successful GitHub polling rather than merely
    # checking whether the Python process is still running.
    #
    # With the default 300-second polling interval, the collector is
    # considered unhealthy if no successful poll has completed within
    # 900 seconds.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/healthcheck.py"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m

    # Reliability:
    # Allow the Python collector to exit cleanly.
    stop_grace_period: 30s

    # Security / operations:
    # Prevent Docker stdout/stderr logs from consuming unlimited disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # Security:
    # The collector is a non-interactive background service.
    stdin_open: false
    tty: false


volumes:
  # Persistent SIEM event log storage.
  github_logs:

  # Persistent SQLite database used for event deduplication
  # and polling state.
  github_state:


# Configuration:
# Optional external SIEM network.
#
# Normally this is NOT required because the collector communicates
# outbound to GitHub and writes events to a shared volume.
#
# Uncomment this section only if the collector must communicate directly
# with containers on an existing SIEM Docker network.
#
# Replace <SIEM_NETWORK> with the exact existing Docker network name.
#
# The network must already exist because external: true tells Docker
# Compose not to create or manage it.
#
# networks:
#   <SIEM_NETWORK>:
#     external: true
